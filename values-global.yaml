---
global:
  pattern: aap-starter-kit
  singleArgoCD: true
  vpNewFolderDir: true
  secretLoader:
    disabled: false
  hub:
    provider: aws
  options:
    installPlanApproval: Automatic
    syncPolicy: Automatic
    useCSV: false
main:
  # Variants live under variants/<name>/values-<name>.yaml
  # minimal-aap | aap-with-hub | aap-with-ao | complete-aap-with-ao
  variant: complete-aap-with-ao
  multiSourceConfig:
    enabled: true
    # Need >= 0.9.57 for variants/ folder path helpers (vpNewFolderDir).
    clusterGroupChartVersion: 0.9.*
