---
clusterGroup:
  name: hub
  isHubCluster: true
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    openshift-cluster-csi-drivers:
      operatorGroup: true
      targetNamespaces: []
    ansible-automation-platform:
    aap-config:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
  subscriptions:
    aap-operator:
      name: ansible-automation-platform-operator
      namespace: ansible-automation-platform
      channel: stable-2.6
    openshift-sscsi:
      name: secrets-store-csi-driver-operator
      namespace: openshift-cluster-csi-drivers
      channel: stable
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
  applications:
    aap:
      name: ansible-automation-platform
      namespace: ansible-automation-platform
      chart: ansible-automation-platform-instance
      chartVersion: 0.1.*
    aap-config:
      name: aap-config
      namespace: aap-config
      # chart: aap-config
      # chartVersion: 0.2.*
      repoURL: https://github.com/mhjacks/aap-config-chart.git
      chartVersion: test_sscsi
      path: "."
      # rhvp.cluster_utils: vault_ss_csi_workload_auth reads this and creates
      # auth/<vault_hub>/role/<vault_hub>-sscsi-<slug> (policies = hub-role set).
      # Helm CSI / RBAC values live in overrides/values-aap-config-csi.yaml (single place; keep SA+ns aligned).
      ssCsiWorkloadAuth:
        # roleSlug must match aap-config chart when csiWorkloadIdentity.vaultKubernetesAuthRole is empty
        # (hub-sscsi-<ns>-<sa>-<appKey>); see overrides/values-aap-config-csi.yaml.
        - serviceAccount: aap-config-sa
          namespace: aap-config
          cluster: hub
          roleSlug: aap-config-aap-config-sa-aap-config
      extraValueFiles:
        - $patternref/overrides/values-aap-config-csi.yaml
        - $patternref/overrides/values-aap-config-aeg.yaml
      # Per-app object replaces global.options.syncPolicy shorthand for this Application only.
      syncPolicy:
        automated: {}
        retry:
          limit: 20
        syncOptions:
          - RespectIgnoreDifferences=true
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    vault:
      name: vault
      namespace: vault
      # chart: hashicorp-vault
      # chartVersion: 0.1.*
      repoURL: https://github.com/mhjacks/hashicorp-vault-chart.git
      chartVersion: add_csi
      path: "."
      # CSI CA mount: same ConfigMap name as openshift-sscsi-vault syncProviderCaConfigMap (CNO-injected
      # bundle by default; see overrides/values-aap-config-csi.yaml + values-vault-csi-tls-ca.yaml).
      extraValueFiles:
        - $patternref/overrides/values-vault-csi-tls-ca.yaml
      overrides:
        - name: vault.csi.enabled
          value: true
        # OpenShift: provider DaemonSet must publish sockets where the Secrets Store CSI driver looks (not /var/run/...).
        - name: vault.csi.daemonSet.providersDir
          value: /etc/kubernetes/secrets-store-csi-providers
    # Hub/spoke Proxy trustedCA + bundle aggregation (chart defaults align with CNO-injected trust
    # used by openshift-sscsi-vault / external-secrets-style patterns; optional extraValueFiles if needed).
    vp-cluster-truster:
      name: vp-manage-proxy-cluster-ca
      namespace: openshift-config
      chartVersion: main
      repoURL: https://github.com/mhjacks/vp-manage-proxy-cluster-ca-chart.git
      path: '.'
      overrides:
        - name: acm.enabled
          value: false
  imperative:
    image: quay.io/martjack/vp-utility-container-test:latest
    verbosity: '-vvv'
    # clustergroup-chart replaces the default imperative ClusterRole rules when this is set (see
    # templates/imperative/clusterrole.yaml), so keep the chart default get/list/watch on * plus
    # create/update/patch on ConfigMaps cluster-wide (vault_ss_csi_* route CA ConfigMaps, etc.).
    clusterRoleYaml:
      - apiGroups:
          - '*'
        resources:
          - '*'
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ''
        resources:
          - configmaps
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
  # OCP: Secrets Store CSI operator alone does not register the driver; ClusterCSIDriver is required
  # (see "Installing the Secrets Store CSI driver" in OpenShift CSI docs).
  extraObjects:
    secrets-store-csi-clustercsidriver:
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: secrets-store.csi.k8s.io
        annotations:
          # After operator CSV: docs order is install operator then create ClusterCSIDriver.
          argocd.argoproj.io/sync-wave: "15"
      # spec must not be empty: OperatorSpec requires managementState; omit driverConfig entirely (do not set {}).
      spec:
        managementState: Managed
        logLevel: Normal
        operatorLogLevel: Normal
  managedClusterGroups: {}
