---
clusterGroup:
  name: hub
  isHubCluster: true
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    openshift-cluster-csi-drivers:
      operatorGroup: true
      targetNamespaces: []
    ansible-automation-platform:
    aap-config:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
  subscriptions:
    aap-operator:
      name: ansible-automation-platform-operator
      namespace: ansible-automation-platform
      channel: stable-2.6
    openshift-sscsi:
      name: secrets-store-csi-driver-operator
      namespace: openshift-cluster-csi-drivers
      channel: stable
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
  applications:
    aap:
      name: ansible-automation-platform
      namespace: ansible-automation-platform
      chart: ansible-automation-platform-instance
      chartVersion: 0.1.*
    aap-config:
      name: aap-config
      namespace: aap-config
      # chart: aap-config
      # chartVersion: 0.2.*
      repoURL: https://github.com/mhjacks/aap-config-chart.git
      chartVersion: test_sscsi
      path: "."
      # rhvp.cluster_utils: vault_ss_csi_workload_auth reads this and creates
      # auth/<vault_hub>/role/<vault_hub>-sscsi-<roleSlug> (policies = hub-role set).
      # Helm CSI / RBAC values live in overrides/values-aap-config-csi.yaml (single place; keep SA+ns aligned).
      ssCsiWorkloadAuth:
        # roleSlug is stable_slug <namespace>-<serviceAccount>-<appKey> (Ansible creates Vault role
        # <vault_hub>-sscsi-<roleSlug>). Must match aap-config when vaultKubernetesAuthRole is empty;
        # see overrides/values-aap-config-csi.yaml.
        - serviceAccount: aap-config-sa
          namespace: aap-config
          roleSlug: aap-config-aap-config-sa-aap-config
      extraValueFiles:
        - $patternref/overrides/values-aap-config-csi.yaml
        - $patternref/overrides/values-aap-config-aeg.yaml
      # CNO fills ConfigMap.data after apply (keys/values can shift); ignore whole data blob vs one key.
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: aap-manifest-vault-tls-ca
          namespace: aap-config
          jsonPointers:
            - /data
          jqPathExpressions:
            - .data
      # Per-app object replaces global.options.syncPolicy shorthand for this Application only.
      syncPolicy:
        automated: {}
        retry:
          limit: 20
        syncOptions:
          - RespectIgnoreDifferences=true
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    vault:
      name: vault
      namespace: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*
    # Hub/spoke Proxy trustedCA + bundle aggregation (chart defaults align with CNO-injected trust
    # used by openshift-sscsi-vault / external-secrets-style patterns; optional extraValueFiles if needed).
    vp-cluster-truster:
      name: vp-manage-proxy-cluster-ca
      namespace: openshift-config
      chart: vp-manage-proxy-cluster-ca
      chartVersion: 0.1.*
      overrides:
        - name: acm.enabled
          value: false
  imperative:
    # Chart default image: quay.io/validatedpatterns/utility-container (same as multicloud-gitops hub).
    # ansibleDevMode installs rhvp.cluster_utils from Git; override imperative.image only if you need a custom util image.
    verbosity: '-vvv'
    extraPlaybookArgs:
      - '-e'
      - 'pattern_dir=/git/repo'
    ansibleDevMode:
      enabled: true
      requirementsFile: requirements.yml
      requirementsContent: |
        ---
        collections:
          - name: git+https://github.com/mhjacks/rhvp.cluster_utils.git,feature/sscsi-vp-proxy-cluster-ca-chart
      ansibleCfgContent: |
        [defaults]
        localhost_warning=False
        retry_files_enabled=False
        # Retry files disabled to avoid cluttering CI/CD environments
        interpreter_python=auto_silent
        timeout=30
        library=~/.ansible/plugins/modules:./ansible/plugins/modules:./common/ansible/plugins/modules:/usr/share/ansible/plugins/modules
        roles_path=~/.ansible/roles:./ansible/roles:./common/ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
        filter_plugins=~/.ansible/plugins/filter:./ansible/plugins/filter:./common/ansible/plugins/filter:/usr/share/ansible/plugins/filter
        collections_path=~/.ansible/collections:/usr/share/ansible/collections
    # clustergroup-chart replaces the default imperative ClusterRole rules when this is set (see
    # templates/imperative/clusterrole.yaml), so keep the chart default get/list/watch on * plus
    # create/update/patch on ConfigMaps cluster-wide (vault_ss_csi_* route CA ConfigMaps, etc.).
    clusterRoleYaml:
      - apiGroups:
          - '*'
        resources:
          - '*'
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ''
        resources:
          - configmaps
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
  # OCP: Secrets Store CSI operator alone does not register the driver; ClusterCSIDriver is required
  # (see "Installing the Secrets Store CSI driver" in OpenShift CSI docs).
  extraObjects:
    secrets-store-csi-clustercsidriver:
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: secrets-store.csi.k8s.io
        annotations:
          # After operator CSV: docs order is install operator then create ClusterCSIDriver.
          argocd.argoproj.io/sync-wave: "15"
      # spec must not be empty: OperatorSpec requires managementState; omit driverConfig entirely (do not set {}).
      spec:
        managementState: Managed
        logLevel: Normal
        operatorLogLevel: Normal
  managedClusterGroups: {}
