---
clusterGroup:
  name: hub
  isHubCluster: true
  namespaces:
    vault:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    openshift-sscsi:
    openshift-sscsi-vault-demo:
    ansible-automation-platform:
    aap-config:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
  subscriptions:
    aap-operator:
      name: ansible-automation-platform-operator
      namespace: ansible-automation-platform
      channel: stable-2.6
      annotations: {}
    openshift-sscsi:
      name: secrets-store-csi-driver-operator
      namespace: openshift-cluster-csi-drivers
      channel: stable
      source: redhat-operators
      sourceNamespace: openshift-marketplace
      # Required whenever sequenceJob is set: clustergroup coalesce() still evaluates get($subs.annotations,...).
      annotations: {}
      # Wait for default catalog so OLM does not sit in "Unknown" / InstallPlan pending (Argo stays on Subscription health).
      sequenceJob:
        disabled: false
        hookType: Sync
        syncWave: "-3"
        resourceType: catalogsource
        resourceName: redhat-operators
        resourceNamespace: openshift-marketplace
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
      annotations: {}
  applications:
    aap:
      name: ansible-automation-platform
      namespace: ansible-automation-platform
      chart: ansible-automation-platform-instance
      chartVersion: 0.1.*
    aap-config:
      name: aap-config
      namespace: aap-config
      # chart: aap-config
      # chartVersion: 0.2.*
      repoURL: https://github.com/mhjacks/aap-config-chart.git
      chartVersion: test_sscsi
      path: "."
      overrides:
        # aap-config-chart test_sscsi: deliver aap-manifest via Vault CSI (openshift-sscsi-vault subchart) instead of ExternalSecret.
        - name: aapManifest.csi.enabled
          value: true
        # Workload identity for Vault CSI (SecretProviderClass namespace + tokenreview binding); rhvp.cluster_utils can read these to extend hub Kubernetes auth.
        - name: serviceAccountName
          value: aap-config-sa
        - name: serviceAccountNamespace
          value: aap-config
        - name: openshift-sscsi-vault.ocpSecretsStoreCsiVault.rbac.rolename
          value: hub-role
        - name: openshift-sscsi-vault.ocpSecretsStoreCsiVault.rbac.serviceAccount.create
          value: false
        - name: openshift-sscsi-vault.ocpSecretsStoreCsiVault.rbac.serviceAccount.name
          value: aap-config-sa
        - name: openshift-sscsi-vault.ocpSecretsStoreCsiVault.rbac.serviceAccount.namespace
          value: aap-config
      extraValueFiles:
        - $patternref/overrides/values-aap-config-aeg.yaml
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    vault:
      name: vault
      namespace: vault
      # chart: hashicorp-vault
      # chartVersion: 0.1.*
      repoURL: https://github.com/mhjacks/hashicorp-vault-chart.git
      chartVersion: add_csi
      path: "."
      overrides:
        - name: vault.csi.enabled
          value: true
  imperative:
    image: quay.io/martjack/vp-utility-container-test:latest
  # OCP: Secrets Store CSI operator alone does not register the driver; ClusterCSIDriver is required
  # (see "Installing the Secrets Store CSI driver" in OpenShift CSI docs).
  extraObjects:
    secrets-store-csi-clustercsidriver:
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: secrets-store.csi.k8s.io
        annotations:
          # After operator CSV: docs order is install operator then create ClusterCSIDriver.
          argocd.argoproj.io/sync-wave: "15"
      spec:
        managementState: Managed
  managedClusterGroups: {}
