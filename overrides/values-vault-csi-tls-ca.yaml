# Vault Helm values merged via values-hub clusterGroup.applications.vault.extraValueFiles.
# Mount path must match openshift-sscsi-vault.caProvider.syncProviderCaConfigMap.mountDir from
# aap-config (defaults). ConfigMap openshift-sscsi-vault-vault-tls-ca is rendered by aap-config;
# TLS/CNO behavior is documented in overrides/values-aap-config-csi.yaml.
#
# Optional projected item + ignoreDifferences on that ConfigMap (values-hub aap-config app): pod can
# schedule before CNO writes ca-bundle.crt. Legacy PEM-only mounts: switch volume style in
# values-aap-config-csi.yaml instead of this file.
---
vault:
  csi:
    volumes:
      - name: openshift-sscsi-vault-ca
        projected:
          defaultMode: 420
          sources:
            - configMap:
                name: openshift-sscsi-vault-vault-tls-ca
                optional: true
                items:
                  - key: ca-bundle.crt
                    path: ca-bundle.crt
    volumeMounts:
      - name: openshift-sscsi-vault-ca
        mountPath: /etc/pki/vault-ca
        readOnly: true
