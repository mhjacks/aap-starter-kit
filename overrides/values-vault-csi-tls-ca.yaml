# Referenced from values-hub.yaml clusterGroup.applications.vault.extraValueFiles so Argo merges this
# into the Vault Helm release. Mounts the ConfigMap at /etc/pki/vault-ca (must match
# openshift-sscsi-vault.caProvider.syncProviderCaConfigMap.mountDir). By default the PEM is created by
# rhvp.cluster_utils (vault playbook: vault_ss_csi_* → ConfigMap openshift-sscsi-vault-vault-tls-ca);
# openshift-sscsi-vault chart defaults use createConfigMap: false and vaultCACertPath to that mount.
# Override with pemLiteral / createConfigMap+useLookup only if not using the Ansible-managed CM.
---
vault:
  csi:
    volumes:
      - name: openshift-sscsi-vault-ca
        configMap:
          name: openshift-sscsi-vault-vault-tls-ca
    volumeMounts:
      - name: openshift-sscsi-vault-ca
        mountPath: /etc/pki/vault-ca
        readOnly: true
