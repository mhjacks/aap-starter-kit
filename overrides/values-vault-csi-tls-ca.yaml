# Referenced from values-hub.yaml clusterGroup.applications.vault.extraValueFiles so Argo merges this
# into the Vault Helm release. Mounts the ConfigMap at /etc/pki/vault-ca (must match
# openshift-sscsi-vault.caProvider.syncProviderCaConfigMap.mountDir).
#
# Default (openshift-sscsi-vault 0.0.15+ + overrides/values-aap-config-csi.yaml): aap-config renders
# ConfigMap openshift-sscsi-vault-vault-tls-ca with inject-trusted-cabundle; CNO fills ca-bundle.crt
# (cluster defaults + Proxy trustedCA, same merge model as vp-manage-proxy-cluster-ca-chart).
# SecretProviderClass vaultCACertPath points at mountDir/ca-bundle.crt.
# Legacy Ansible PEM at vault-tls-ca.pem: turn off injection in values-aap-config-csi.yaml and keep
# this volume mount; adjust key if you change keyInConfigMap.
---
vault:
  csi:
    volumes:
      - name: openshift-sscsi-vault-ca
        configMap:
          name: openshift-sscsi-vault-vault-tls-ca
    volumeMounts:
      - name: openshift-sscsi-vault-ca
        mountPath: /etc/pki/vault-ca
        readOnly: true
