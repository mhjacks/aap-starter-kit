# Vault CSI for aap-config (openshift-sscsi-vault / vp-sscsi-spc-chart subchart).
# Keep csiWorkloadIdentity.serviceAccount|namespace|appKey aligned with
# clusterGroup.applications.aap-config.ssCsiWorkloadAuth in values-hub.yaml (rhvp.cluster_utils
# vault_ss_csi_workload_auth uses the latter for Kubernetes auth roles).
#
# vaultKubernetesAuthRole: empty under vault_ss_csi_role_slug_mode stable_slug (Vault role name is
# <vault_hub>-sscsi-<namespace>-<serviceAccount>-<appKey>). If hash mode, set to the hub-sscsi-<sha1>
# value from the vault playbook summary.
#
# TLS defaults (aap-config-chart / openshift-sscsi-vault with CNO inject-trusted-cabundle): override
# injectTrustedCabundle / createConfigMap / pemLiteral only for legacy PEM flows.

---
csiWorkloadIdentity:
  enabled: true
  serviceAccount: aap-config-sa
  namespace: aap-config
  vaultAuthMount: hub
  appKey: aap-config
  vaultKubernetesAuthRole: ""

aapManifest:
  csi:
    enabled: true

openshift-sscsi-vault:
  ocpSecretsStoreCsiVault:
    secretProviderClass:
      installDefaultManifests: false
      enabled: true
      name: aap-manifest-vault
    objects:
      - objectName: b64content
        secretPath: secret/data/hub/aap-manifest
        secretKey: b64content
    secretObjects: []
    vault:
      externalAddress: ""
      hubMountPath: hub
